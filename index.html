<!-- /index.html (Phase 1 : Fondations, Navigation, Hero) -->
<!DOCTYPE html>
<html lang="fr" class="lenis lenis-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGNUM | Promoteur Immobilier Haut de Gamme</title>
    <meta name="description" content="Créateur d'espaces de vie exceptionnels. Découvrez nos résidences, appartements et maisons de prestige. L'excellence architecturale incarnée.">
    
    <!-- Preload & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="is-loading">
    
    <!-- Loader -->
    <div class="loader">
        <div class="loader-text">MAGNUM</div>
        <div class="loader-progress"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo magnetic" data-strength="20">
                MAGNUM<span class="accent">.</span>
            </a>
            
            <nav class="nav-desktop">
                <ul class="nav-list">
                    <li><a href="#realisations" class="nav-link magnetic" data-strength="15">Réalisations</a></li>
                    <li><a href="#expertise" class="nav-link magnetic" data-strength="15">Expertise</a></li>
                    <li><a href="residence.html" class="nav-link magnetic" data-strength="15">Résidence SVJ</a></li>
                </ul>
            </nav>

            <a href="mailto:lwilzius@icloud.com" class="btn-contact magnetic" data-strength="30">
                <span>Contact</span>
            </a>

            <button class="menu-burger magnetic" data-strength="20" aria-label="Ouvrir le menu">
                <span class="line line-1"></span>
                <span class="line line-2"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="smooth-wrapper">
        <div id="smooth-content">
            
            <!-- Hero Section -->
            <section class="hero" id="hero">
                <!-- Three.js Canvas Container -->
                <div class="webgl-container" id="hero-canvas"></div>
                
                <div class="hero-wrapper">
                    <div class="hero-content">
                        <div class="subtitle-wrapper">
                            <span class="subtitle">Promoteur de prestige</span>
                        </div>
                        <h1 class="title-main">
                            <span class="line-wrap"><span class="line-inner">Redéfinir</span></span>
                            <span class="line-wrap"><span class="line-inner">l'horizon.</span></span>
                        </h1>
                    </div>
                    
                    <div class="hero-footer">
                        <div class="project-indicator">
                            <span class="label">Projet en cours</span>
                            <span class="value">Luxembourg — Édition Limitée</span>
                        </div>
                        
                        <div class="scroll-indicator magnetic" data-strength="10">
                            <span class="scroll-text">Découvrir</span>
                            <div class="scroll-line">
                                <div class="scroll-line-inner"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Scripts via CDN pour la performance et compatibilité GitHub/Cloudflare -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/animations.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
